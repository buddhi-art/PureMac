name: Release Unsigned

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.2.0). Must match project.yml MARKETING_VERSION.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Unsigned DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install tools
        run: brew install xcodegen create-dmg xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project PureMac.xcodeproj \
            -scheme PureMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/PureMac.xcarchive \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | xcbeautify
            
      - name: Extract App from Archive
        run: |
          mkdir -p build/export
          cp -R build/PureMac.xcarchive/Products/Applications/PureMac.app build/export/PureMac.app
          
      - name: Verify Architectures
        run: |
          APP="build/export/PureMac.app"
          lipo -archs "${APP}/Contents/MacOS/PureMac" | grep -q "x86_64" && lipo -archs "${APP}/Contents/MacOS/PureMac" | grep -q "arm64"
          echo "Architectures: $(lipo -archs ${APP}/Contents/MacOS/PureMac)"

      - name: Build DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DMG="build/PureMac-${VERSION}.dmg"
          create-dmg \
            --volname "PureMac ${VERSION}" \
            --window-size 540 360 \
            --icon-size 100 \
            --icon "PureMac.app" 140 180 \
            --hide-extension "PureMac.app" \
            --app-drop-link 400 180 \
            --no-internet-enable \
            "${DMG}" \
            build/export/PureMac.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: puremac-${{ steps.ver.outputs.version }}
          path: build/PureMac-${{ steps.ver.outputs.version }}.dmg
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          DMG="build/PureMac-${VERSION}.dmg"
          
          echo "## PureMac ${VERSION} (Unsigned)" > release_notes.md
          echo "This is an unsigned build for testing purposes." >> release_notes.md
          
          # Delete existing release if it exists to overwrite
          gh release delete "${TAG}" -y || true
          
          gh release create "${TAG}" \
            --title "PureMac ${VERSION}" \
            --notes-file release_notes.md \
            "${DMG}"
